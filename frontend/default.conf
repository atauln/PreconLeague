server {
    listen       8080;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app under the '/PreconLeague/' base path used by Vite.
    # Requests to /PreconLeague/... will map to files under /usr/share/nginx/html/...
    location /PreconLeague/ {
        # 'alias' replaces the matched prefix with the path; this maps
        # /PreconLeague/assets/... -> /usr/share/nginx/html/assets/...
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /PreconLeague/index.html;
    }

    # Also respond on the root path so healthchecks work
    location = / {
        try_files /index.html =404;
    }

    # Optional: increase client body size if uploads needed
    client_max_body_size 10M;

    # Logging (kept minimal)
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;
}