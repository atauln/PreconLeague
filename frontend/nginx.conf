server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve files directly, fall back to index.html for client-side routing
    # Serve files at the site root (if app is served at root)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If the app is built with a base path (e.g. `/PreconLeague/`),
    # serve files under that path and fall back to the prefixed index.html
    location /PreconLeague/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /PreconLeague/index.html;
    }

    # Cache long-lived static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API requests to the backend server
    location /api/ {
        proxy_pass http://precon-league-api-1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
